<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".56" numOctaves="3" seed="24" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".34" intercept=".24"/>
        <feFuncG type="linear" slope=".27" intercept=".18"/>
        <feFuncB type="linear" slope=".19" intercept=".11"/>
        <feFuncA type="linear" slope=".13"/>
      </feComponentTransfer>
    </filter>
    <filter id="wash" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .60 0 0 0 0 .39 0 0 0 0 .20 0 0 0 .07 0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#wash)"/>
  <rect width="100%" height="100%" filter="url(#paper)"/>
</svg>
